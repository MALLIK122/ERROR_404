<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    
    <!-- SEO & Meta Tags -->
    <meta name="description" content="Security Gateway • Resource unavailable">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#050505">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://acesse.one/error404-chapter-1">
    <meta property="og:title" content="404 | Page Not Found">
    <meta property="og:description" content="Security Gateway • Resource unavailable">
    <meta property="og:image" content="https://raw.githubusercontent.com/MALLIK122/ERROR_404/main/public/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://acesse.one/error404-chapter-1">
    <meta property="twitter:title" content="404 | Page Not Found">
    <meta property="twitter:description" content="Security Gateway • Resource unavailable">
    <meta property="twitter:image" content="https://raw.githubusercontent.com/MALLIK122/ERROR_404/main/public/og-image.jpg">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="grid-bg"></div>
    
    <main class="container">
        <div class="error-content">
            <h1 class="glitch" data-text="404">404</h1>
            <h2 class="title">PAGE NOT FOUND</h2>
            
            <div class="message-group">
                <p class="primary-msg">The requested resource could not be found.</p>
                <p class="secondary-msg">Access to this resource is unavailable or the link may have expired.</p>
            </div>

            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfBz7yFd8d8V-ZCpoAYpjnxx_mpWjqA0e30T6Vq3Ye8LxySpQ/viewform?usp=publish-editor" class="action-btn" aria-label="Return to Google Form">
                <span class="btn-text">RETURN TO FORM</span>
                <span class="btn-glow"></span>
            </a>

            <div class="status-panel">
                <div class="status-header">SYSTEM STATUS</div>
                <ul class="status-list">
                    <li>
                        <span class="indicator error"></span>
                        <span class="status-text typing-1">CONNECTION FAILED</span>
                    </li>
                    <li>
                        <span class="indicator error"></span>
                        <span class="status-text typing-2">RESOURCE NOT FOUND</span>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <footer>
        <p>SECURITY GATEWAY // ERROR 404</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
